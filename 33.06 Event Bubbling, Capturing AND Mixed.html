<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling & Capturing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 760px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        h2 {
            margin-top: 0;
        }

        .info {
            color: #555;
        }

        .buttons {
            margin: 20px 0;
        }

        .buttons button {
            padding: 10px 18px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
        }

        #grandparent {

            background: #fde68a;
            padding: 30px;
            border-radius: 8px;
        }

        #parent {

            background: #93c5fd;
            padding: 30px;
            border-radius: 8px;
        }

        #child {

            background: #16a34a;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #log {

            margin-top: 20px;
            background: #222;
            color: #00ff66;
            min-height: 220px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            overflow: auto;
        }

        #child:hover {
            border: 1px solid #20613a;
        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Event Bubbling & Capturing</h2>

        <p class="info">

            Choose a mode.

            Then click the green button.

        </p>

        <div class="buttons">

            <button id="bubbleBtn">Bubbling</button>

            <button id="captureBtn">Capturing</button>

            <button id="mixedBtn">Mixed</button>

            <button id="clearBtn">Clear Log</button>

        </div>

        <div id="grandparent">

            Grandparent

            <br><br>

            <div id="parent">

                Parent

                <br><br>

                <button id="child"> Click Me </button>

            </div>

        </div>

        <div id="log"></div>

    </div>

    <script>

        let grand = document.querySelector("#grandparent");
        let parent = document.querySelector("#parent");
        let child = document.querySelector("#child");
        let log = document.querySelector("#log");

        function print(text) {

            log.innerHTML += text + "<br>";
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {

            log.innerHTML = "";

        }

        function removeListeners() {

            const newGrand = grand.cloneNode(true);

            grand.replaceWith(newGrand);

            grand = newGrand;
            parent = newGrand.querySelector("#parent");
            child = newGrand.querySelector("#child");

        }

        //--------------------------------------
        // Bubble
        //--------------------------------------

        document.querySelector("#bubbleBtn").onclick = () => {

            clearLog();

            removeListeners();

            print("Mode : Bubbling");
            print("----------------");

            grand.addEventListener("click", () => {

                print("🟡 Grandparent");

            });

            parent.addEventListener("click", () => {

                print("🔵 Parent");

            });

            child.addEventListener("click", () => {

                print("🟢 Child");

            });

        };

        //--------------------------------------
        // Capture
        //--------------------------------------

        document.querySelector("#captureBtn").onclick = () => {

            clearLog();

            removeListeners();

            print("Mode : Capturing");
            print("----------------");

            grand.addEventListener("click", () => {

                print("🟡 Grandparent");

            }, { capture: true });

            parent.addEventListener("click", () => {

                print("🔵 Parent");

            }, { capture: true });

            child.addEventListener("click", () => {

                print("🟢 Child");

            }, { capture: true });

        };

        //--------------------------------------
        // Mixed
        //--------------------------------------

        document.querySelector("#mixedBtn").onclick = () => {

            clearLog();

            removeListeners();

            print("Mode : Mixed");
            print("----------------");

            grand.addEventListener("click", () => {

                print("🟡 Grandparent");

            }, { capture: true });

            parent.addEventListener("click", () => {

                print("🔵 Parent");

            });

            child.addEventListener("click", () => {

                print("🟢 Child");

            });

        };

        document.querySelector("#clearBtn").onclick = clearLog;

    </script>

</body>

</html>
