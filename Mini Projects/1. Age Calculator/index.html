<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>Age Calculator</h1>
            <p class="subtitle">Enter your date of birth below</p>
        </header>

        <div class="input-group">

            <div class="field">
                <label for="day">Day</label>
                <input id="day" type="number" placeholder="DD" min="1" max="31" autocomplete="off">
            </div>

            <div class="field">
                <label for="month">Month</label>
                <input id="month" type="number" placeholder="MM" min="1" max="12" autocomplete="off">
            </div>

            <div class="field">
                <label for="year">Year</label>
                <input id="year" type="number" placeholder="YYYY" min="1900" autocomplete="off">
            </div>

        </div>

        <p id="error"></p>      <!-- Error message container -->

        <button id="calcBtn">Calculate Age</button>

        <!-- Hidden by default, shown after calculation -->
        <div id="result">

            <div class="result-card">
                <span id="years">0</span>
                <label>Years</label>
            </div>

            <div class="result-card">
                <span id="months">0</span>
                <label>Months</label>
            </div>

            <div class="result-card">
                <span id="days">0</span>
                <label>Days</label>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
