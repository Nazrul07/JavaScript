<!-- This only works on a touchscreen device (phone, tablet, or a laptop with a touch display) -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Touch Events Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

        }

        .card {

            width: 700px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);

        }

        .touchable {

            margin-top: 20px;

            height: 250px;

            background: #4caf50;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;

            border-radius: 10px;

            user-select: none;

            touch-action: none;

        }

        #log {

            margin-top: 20px;

            background: #222;
            color: #00ff66;

            height: 220px;

            overflow-y: auto;

            padding: 15px;

            border-radius: 8px;

            font-family: monospace;

            white-space: pre-wrap;

        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Touch Events</h2>

        <p>

            Touch and move your finger inside the green box.

        </p>

        <div class="touchable">

            Touch Me

        </div>

        <div id="log"></div>

    </div>

    <script>

        const box = document.querySelector(".touchable");
        const log = document.querySelector("#log");

        function print(text) {

            log.innerHTML += text + "<br>";
            log.scrollTop = log.scrollHeight;

        }

        box.addEventListener("touchstart", (e) => {

            const touch = e.touches[0];

            print("🟢 touchstart");

            print("X : " + touch.clientX);

            print("Y : " + touch.clientY);

            print("----------------");

        });

        box.addEventListener("touchmove", (e) => {

            const touch = e.touches[0];

            print("➡ move : " + touch.clientX + " , " + touch.clientY);

        });

        box.addEventListener("touchend", () => {

            print("🔴 touchend");
            print("----------------");

        });

        box.addEventListener("touchcancel", () => {

            print("⚠ touchcancel");

        });

    </script>

</body>

</html>
