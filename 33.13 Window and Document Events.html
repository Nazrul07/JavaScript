<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window & Document Events</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .card {

            width: 850px;

            background: white;

            margin: 40px auto;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);

        }

        .info {

            color: #555;
            line-height: 1.7;

        }

        .spacer {

            height: 1200px;

            background: linear-gradient(white, #ddd);

            margin-top: 30px;

        }

        #log {

            margin-top: 20px;

            background: #222;

            color: #00ff66;

            height: 240px;

            overflow-y: auto;

            padding: 15px;

            border-radius: 8px;

            font-family: monospace;

            white-space: pre-wrap;

        }

        button {

            padding: 10px 18px;
            cursor: pointer;

        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Window & Document Events</h2>

        <p class="info">

            Try these:

            • Reload the page

            • Resize the browser

            • Scroll down

            • Switch to another tab

            • Turn Internet OFF then ON

        </p>

        <button id="clearBtn">

            Clear Log

        </button>

        <div id="log"></div>

        <div class="spacer"></div>

    </div>

    <script>

        const log = document.querySelector("#log");

        function print(text) {

            log.innerHTML += text + "<br>";
            log.scrollTop = log.scrollHeight;

        }

        document.querySelector("#clearBtn").onclick = () => {

            log.innerHTML = "";

        };

        //-----------------------------------
        // DOMContentLoaded
        //-----------------------------------

        document.addEventListener("DOMContentLoaded", () => {

            print("① DOMContentLoaded");

        });

        //-----------------------------------
        // load
        //-----------------------------------

        window.addEventListener("load", () => {

            print("② Window Load");

        });

        //-----------------------------------
        // visibilitychange
        //-----------------------------------

        document.addEventListener("visibilitychange", () => {

            if (document.hidden) {

                print("🙈 Tab Hidden");

            } else {

                print("👀 Tab Visible");

            }

        });

        //-----------------------------------
        // resize
        //-----------------------------------

        window.addEventListener("resize", () => {

            print(
                `📐 ${window.innerWidth} × ${window.innerHeight}`
            );

        });

        //-----------------------------------
        // scroll
        //-----------------------------------

        window.addEventListener("scroll", () => {

            print(
                `📜 ScrollY = ${window.scrollY}`
            );

        });

        //-----------------------------------
        // online / offline
        //-----------------------------------

        window.addEventListener("online", () => {

            print("🟢 Back Online");

        });

        window.addEventListener("offline", () => {

            print("🔴 Offline");

        });

    </script>

</body>

</html>
