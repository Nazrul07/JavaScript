<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling & Capturing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 760px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        h2 {
            margin-top: 0;
        }

        .info {
            color: #555;
        }

        #grandparent {
            background: #fde68a;
            padding: 35px;
            border-radius: 8px;
        }

        #parent {
            background: #93c5fd;
            padding: 35px;
            border-radius: 8px;
        }

        #child {
            background: rgb(40, 176, 40);
            color: #fff;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #log {
            margin-top: 20px;
            background: #222;
            color: #00ff66;
            padding: 15px;
            border-radius: 8px;
            min-height: 180px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow: auto;
        }

        button.control {
            background: rgb(177, 78, 78);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            margin-right: 10px;
            padding: 10px 18px;
        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Event Bubbling & Capturing</h2>

        <p class="info">

            Open the log below.

            <br><br>

            1. Click <b>Enable Bubbling</b>

            <br>

            2. Click the inner button.

            <br><br>

            Then try <b>Enable Capturing</b> and click again.

        </p>

        <div id="grandparent">

            Grandparent

            <div id="parent">

                Parent

                <br><br>

                <button id="child">
                    Click Me
                </button>

            </div>

        </div>

        <button class="control" id="bubbleBtn">
            Enable Bubbling
        </button>

        <button class="control" id="captureBtn">
            Enable Capturing
        </button>

        <div id="log"></div>

    </div>

    <script>

        const grand = document.querySelector("#grandparent");
        const parent = document.querySelector("#parent");
        const child = document.querySelector("#child");
        const log = document.querySelector("#log");

        function print(text) {

            log.innerHTML += text + "<br>";
            log.scrollTop = log.scrollHeight;

        }

        function clearAll() {

            const grand = document.querySelector("#grandparent");
            const newGrand = grand.cloneNode(true);

            grand.replaceWith(newGrand);

            return {
                grand: newGrand,
                parent: newGrand.querySelector("#parent"),
                child: newGrand.querySelector("#child")
            };

        }

        //----------------------------
        // Bubbling
        //----------------------------

        document.querySelector("#bubbleBtn").onclick = () => {

            log.innerHTML = "";

            const obj = clearAll();

            obj.grand.addEventListener("click", () => {

                print("🟡 Grandparent");

            });

            obj.parent.addEventListener("click", () => {

                print("🔵 Parent");

            });

            obj.child.addEventListener("click", () => {

                print("🟢 Child");

            });

            print("Bubbling Enabled");
            print("-----------------------");

        };

        //----------------------------
        // Capturing
        //----------------------------

        document.querySelector("#captureBtn").onclick = () => {

            log.innerHTML = "";

            const obj = clearAll();

            obj.grand.addEventListener("click", () => {

                print("🟡 Grandparent");

            }, { capture: true });

            obj.parent.addEventListener("click", () => {

                print("🔵 Parent");

            }, { capture: true });

            obj.child.addEventListener("click", () => {

                print("🟢 Child");

            }, { capture: true });

            print("Capturing Enabled");
            print("-----------------------");

        };

    </script>

</body>

</html>
