<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Infinite Scroll</h1>
        <p class="subtitle">Scroll down to load more items</p>
    </header>

    <div class="container">

        <!-- Items are injected here by JS -->
        <div id="list"></div>

        <!-- Loading spinner — shown while items load -->
        <div id="loader">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>

        <!-- End message — shown when all items are loaded -->
        <p id="endMsg">You have reached the end.</p>

        <!--
            Sentinel — an empty invisible div at the very bottom.
            IntersectionObserver watches this.
            When it enters the viewport → load next batch.
        -->
        <div id="sentinel"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
