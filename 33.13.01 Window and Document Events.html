<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Window Events Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            font-family: Arial, sans-serif;

            background: #eef2f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

        }

        .card {

            width: 800px;

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);

        }

        .info {

            color: #555;
            line-height: 1.7;

        }

        button {

            padding: 10px 18px;
            margin-right: 10px;
            margin-top: 10px;
            cursor: pointer;

        }

        #log {

            margin-top: 20px;

            background: #222;
            color: #00ff66;

            height: 220px;
            overflow-y: auto;

            padding: 15px;

            border-radius: 8px;

            font-family: monospace;

            white-space: pre-wrap;

        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Window Events Playground</h2>

        <p class="info">

            Try these:

            <br><br>

            1. Click <b>Throw Error</b>

            <br>

            2. Click <b>Promise Error</b>

            <br>

            3. Refresh or close the tab

            <br>

            4. Watch the console (F12)

        </p>

        <button id="errorBtn">

            Throw Error

        </button>

        <button id="promiseBtn">

            Promise Error

        </button>

        <button id="clearBtn">

            Clear Log

        </button>

        <div id="log"></div>

    </div>

    <script>

        const log = document.querySelector("#log");

        function print(text) {

            log.innerHTML += text + "<br>";
            log.scrollTop = log.scrollHeight;

        }

        document.querySelector("#clearBtn").onclick = () => {

            log.innerHTML = "";

        };

        //-------------------------------------
        // beforeunload
        //-------------------------------------

        window.addEventListener("beforeunload", (e) => {

            e.preventDefault();

            e.returnValue = "";

            console.log("beforeunload fired");

        });

        //-------------------------------------
        // unload
        //-------------------------------------

        window.addEventListener("unload", () => {

            console.log("Page unloaded");

        });

        //-------------------------------------
        // Global Error
        //-------------------------------------

        window.addEventListener("error", (e) => {

            print("❌ Global Error");

            print("Message : " + e.message);

            print("File : " + e.filename);

            print("Line : " + e.lineno);

        });

        //-------------------------------------
        // Promise Error
        //-------------------------------------

        window.addEventListener("unhandledrejection", (e) => {

            print("⚠ Unhandled Promise");

            print("Reason : " + e.reason);

            e.preventDefault();

        });

        //-------------------------------------
        // Buttons
        //-------------------------------------

        document.querySelector("#errorBtn").onclick = () => {

            undefinedFunction();

        };

        document.querySelector("#promiseBtn").onclick = () => {

            Promise.reject("Database connection failed.");

        };

    </script>

</body>

</html>
