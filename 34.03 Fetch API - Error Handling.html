<!DOCTYPE html>
<html>

<head>
    <title>Fetch API - Error Handling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 500px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 10px 15px;
            margin-right: 8px;
            cursor: pointer;
        }

        #log {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            color: #00ff88;
            min-height: 150px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>Fetch API</h2>

        <button id="successBtn">
            Successful Request
        </button>

        <button id="errorBtn">
            404 Request
        </button>

        <div id="log"></div>

    </div>

    <script>

        const log = document.getElementById("log");

        function print(message) {
            log.textContent += message + "\n";
        }


        // Successful request
        document.getElementById("successBtn").addEventListener("click", () => {

            log.textContent = "";

            fetch("https://jsonplaceholder.typicode.com/users")
                .then(response => {

                    print("Status: " + response.status);
                    print("OK: " + response.ok);

                    if (!response.ok) {
                        throw new Error("HTTP Error: " + response.status);
                    }

                    return response.json();
                })
                .then(data => {

                    print("Data received!");
                    print("Users: " + data.length);

                })
                .catch(error => {

                    print("Error: " + error.message);

                });

        });


        // 404 request
        document.getElementById("errorBtn").addEventListener("click", () => {

            log.textContent = "";

            fetch("https://jsonplaceholder.typicode.com/abc")
                .then(response => {

                    print("Status: " + response.status);
                    print("OK: " + response.ok);

                    if (!response.ok) {
                        throw new Error("HTTP Error: " + response.status);
                    }

                    return response.json();
                })
                .then(data => {

                    print("Data received!");

                })
                .catch(error => {

                    print("Error: " + error.message);

                });

        });

    </script>

</body>

</html>
