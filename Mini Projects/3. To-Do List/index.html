<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header> 
            <h1>To-Do List</h1>
            <p class="subtitle">Stay organized. Get things done.</p>
        </header>

        <form id="taskForm">
            <input id="taskInput" type="text" placeholder="Add a new task..." autocomplete="off">
            <button type="submit">Add</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMsg">No tasks here.</p>     <!-- Shown when filtered list is empty -->


        <div class="list-footer">
            <span id="taskCount"></span>
            <button id="clearBtn">Clear Completed</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
