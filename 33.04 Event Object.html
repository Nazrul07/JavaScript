<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Object Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 800px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        h2 {
            margin-top: 0;
        }

        .info {
            color: #555;
            margin-bottom: 20px;
        }

        ul {
            padding: 20px;
            background: #dbeafe;
            border: 2px solid steelblue;
            border-radius: 8px;
        }

        li {
            margin: 12px 0;
            list-style: none;
        }

        span {
            display: inline-block;
            padding: 10px 18px;
            background: #4f46e5;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        #log {
            margin-top: 20px;
            background: #222;
            color: #00ff66;
            padding: 15px;
            border-radius: 8px;
            min-height: 240px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow: auto;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>Event Object Demo</h2>

        <p class="info">
            The click listener is attached only to the blue
            <b>
                &lt;
                ul&gt;
            </b>.
            
            <br><br>

            Click any purple
            <b>
                &lt;
                span&gt;
            </b>.
        </p>

        <ul id="list">

            <li>
                <span>Frontend</span>
            </li>

            <li>
                <span>Backend</span>
            </li>

            <li>
                <span>DevOps</span>
            </li>

        </ul>

        <div id="log"></div>

    </div>

    <script>

        const list = document.querySelector("#list");
        const log = document.querySelector("#log");

        list.addEventListener("click", (event) => {

            log.innerHTML = "";

            function print(text) {

                log.innerHTML += text + "<br>";

            }

            print("<b>Identity</b>");
            print("type : " + event.type);         
            print("target : " + event.target.tagName);  
            print("currentTarget : " + event.currentTarget.tagName);
            print("timeStamp : " + Math.round(event.timeStamp));

            print("<br><b>Propagation</b>");
            print("bubbles : " + event.bubbles);
            print("cancelable : " + event.cancelable);
            print("eventPhase : " + event.eventPhase);

        });

    </script>

</body>

</html>
