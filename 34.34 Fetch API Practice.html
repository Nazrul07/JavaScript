
<!DOCTYPE html>
<html>
<head>
    <title>Fetch API Practice</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 760px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }

        #log {
            margin-top: 20px;
            background: #222;
            color: #00ff66;
            min-height: 180px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>User Dashboard</h2>
        <div id="log">Loading users...</div>
    </div>

    <script>
        const log = document.querySelector("#log");

        fetch("https://jsonplaceholder.typicode.com/users")
            .then(response => {
                if(!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                return response.json();
            })

            .then(users => {
                log.textContent = "Users fetched successfully:\n\n";
                users.forEach(user => {
                    log.textContent += `Name: ${user.name}\nEmail: ${user.email}\n\n`;
                }) // This works perfectly for this small example. Another approach is to build the text first and update the DOM once.
            })

            /*
                Alternative approach: And good approach for larger data sets.
                .then(users = {
                    const output = users.map(user => {
                        `Name: ${user.name} Email: ${user.email}`
                    }).join("\n\n");

                    log.textContent = `Users fetched successfully:\n\n${output}`;
                })
            */

            .catch(error => {
                log.textContent = `Error fetching users: ${error.message}`;
            })

            .finally(() => {
                log.textContent += "\nRequest finished.";
            })

    </script>
</body>
</html>
