<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events Playground</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 820px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        .info {
            color: #555;
            line-height: 1.7;
        }

        #playground {

            margin: 25px auto;

            width: 500px;
            height: 260px;

            border: 2px dashed #999;
            border-radius: 10px;

            position: relative;

            overflow: hidden;

            background: #fafafa;

        }

        #player {

            width: 40px;
            height: 40px;

            background: #2563eb;

            border-radius: 8px;

            position: absolute;

            left: 20px;
            top: 20px;

        }

        #log {

            margin-top: 20px;

            background: #222;
            color: #00ff66;

            height: 220px;
            overflow-y: auto;

            padding: 15px;

            border-radius: 8px;

            font-family: monospace;
            white-space: pre-wrap;

        }

        button {

            padding: 10px 18px;
            cursor: pointer;

        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Keyboard Events Playground</h2>

        <p class="info">

            Click anywhere on this page first, then try:

            • Press any key

            • Hold a key

            • Press Shift + A

            • Press Ctrl + S

            • Press Escape

            • Move the blue square using the Arrow Keys

            • Hold Up + Right together for diagonal movement

        </p>

        <div id="playground">

            <div id="player"></div>

        </div>

        <button id="clearBtn">Clear Log</button>

        <div id="log"></div>

    </div>

    <script>

        const player = document.querySelector("#player");
        const log = document.querySelector("#log");

        const keys = new Set();

        let x = 20;
        let y = 20;
        const speed = 4;

        function print(text) {

            log.innerHTML += text + "<br>";
            log.scrollTop = log.scrollHeight;

        }

        document.querySelector("#clearBtn").onclick = () => {

            log.innerHTML = "";

        };

        //------------------------------
        // KEY DOWN
        //------------------------------

        document.addEventListener("keydown", (e) => {

            keys.add(e.code);

            print(
                `⬇ keydown | key=${e.key} | code=${e.code} | repeat=${e.repeat}`
            );

            if (e.ctrlKey && e.key === "s") {

                e.preventDefault();

                print("💾 Ctrl + S intercepted");

            }

            if (e.key === "Escape") {

                print("❌ Escape pressed");

            }

            if (e.shiftKey) {

                print("⬆ Shift is being held");

            }

            if (e.altKey) {

                print("⭐ Alt is being held");

            }

            if (e.metaKey) {

                print("🪟 Meta/Command key held");

            }

        });

        //------------------------------
        // KEY UP
        //------------------------------

        document.addEventListener("keyup", (e) => {

            keys.delete(e.code);

            print(`⬆ keyup | key=${e.key}`);

        });

        //------------------------------
        // GAME LOOP
        //------------------------------

        function gameLoop() {

            if (keys.has("ArrowUp")) {

                y -= speed;

            }

            if (keys.has("ArrowDown")) {

                y += speed;

            }

            if (keys.has("ArrowLeft")) {

                x -= speed;

            }

            if (keys.has("ArrowRight")) {

                x += speed;

            }

            x = Math.max(0, Math.min(460, x));
            y = Math.max(0, Math.min(220, y));

            player.style.left = x + "px";
            player.style.top = y + "px";

            requestAnimationFrame(gameLoop);

        }

        gameLoop();

    </script>

</body>

</html>
