<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IntersectionObserver Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Large top space */
        .top {
            height: 700px;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
        }

        /* Cards */

        .card {

            width: 300px;
            margin: 100px auto;
            padding: 40px;

            background: steelblue;
            color: white;

            border-radius: 10px;

            opacity: 0;
            transform: translateY(100px);

            transition: .6s;
        }

        /* Applied by IntersectionObserver */

        .visible {

            opacity: 1;
            transform: translateY(0);

        }
    </style>

</head>

<body>

    <div class="top">
        Scroll Down
    </div>


    <div class="card" id="card1">
        Card 1
    </div>

    <div class="card" id="card2">
        Card 2
    </div>

    <div class="card" id="card3">
        Card 3
    </div>

    <div class="card" id="card4">
        Card 4
    </div>


    <script>

        const observer = new IntersectionObserver((entries) => {

            entries.forEach(entry => {

                console.log(entry);

                if (entry.isIntersecting) {

                    entry.target.classList.add("visible");

                    console.log(
                        entry.target.id +
                        " is " +
                        (entry.intersectionRatio * 100).toFixed(0) +
                        "% visible"
                    );

                }

            });

        },
            {
                threshold: 0.5,

                rootMargin: "100px"

            });


        document.querySelectorAll(".card").forEach(card => {

            observer.observe(card);

        });

    </script>

</body>

</html>
