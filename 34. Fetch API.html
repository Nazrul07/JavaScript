<!DOCTYPE html>
<html>

<head>
    <title>Fetch API</title>
</head>

<body>

    <button id="btn">Get Data</button>

    <script>
        const btn = document.querySelector("#btn");

        btn.addEventListener("click", () => {

            fetch("https://jsonplaceholder.typicode.com/users");

        });
    </script>

</body>

</html>
