<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint Cost Estimator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Paint Cost Estimator</h1> 

    <section class="card">
      <h2>Room Dimensions</h2>

      <div class="input-group">
        <label for="length">Room Length (meter)</label>
        <input type="number" id="length" placeholder="e.g. 5" />
      </div>

      <div class="input-group">
        <label for="width">Room Width (meter)</label>
        <input type="number" id="width" placeholder="e.g. 4" />
      </div>

      <div class="input-group">
        <label for="height">Wall Height (meter)</label>
        <input type="number" id="height" placeholder="e.g. 3" />
      </div>

      <div class="input-group">
        <label for="doorsWindows">Total Area of Doors/Windows to Exclude (m²)</label>
        <input type="number" id="doorsWindows" placeholder="e.g. 4" />
      </div>
    </section>

    <section class="card">
      <h2>Paint Details</h2>

      <div class="input-group">
        <label for="coats">Number of Coats</label>
        <input type="number" id="coats" placeholder="e.g. 2" />
      </div>

      <div class="input-group">
        <label for="coverage">Coverage per Liter (m²)</label>
        <input type="number" id="coverage" placeholder="e.g. 10" />
      </div>

      <div class="input-group">
        <label for="pricePerLiter">Price per Liter</label>
        <input type="number" id="pricePerLiter" placeholder="e.g. 350" />
      </div>

      <div class="actions">
        <button id="estimateBtn" type="button">Estimate Cost</button>
        <button id="resetBtn" type="button" class="secondary">Reset</button>
      </div>
    </section>

    <section class="card result-card">
      <h2>Result</h2>
      <p>Total Paintable Wall Area: <span id="paintableArea">-</span></p>
      <p>Paint Needed (liters): <span id="paintNeeded">-</span></p>
      <p>Estimated Total Cost: <span id="totalCost">-</span></p>
      <p id="message" class="message">Your calculated message will appear here.</p>
    </section>
  </main>

  <!-- Create script.js yourself and connect your logic -->
  <script src="script.js"></script>
</body>
</html>
